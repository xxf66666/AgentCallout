name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full verification gate
        shell: bash
        run: set -o pipefail; npm run verify 2>&1 | tee verify-output.log
      - name: Report failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = process.env.FAIL_LOG || 'verify-output.log';
            let tail = '';
            try { tail = fs.readFileSync(file, 'utf8').slice(-7000); } catch (e) { tail = String(e); }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] ${{ matrix.os }} node ${{ matrix.node }} failed at ${{ github.sha }}`.slice(0, 90),
              body: '```
' + tail + '
```'
            });

      - name: Push failure log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          tail -c 30000 verify-output.log > failure-tail.txt || true
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git checkout -B "ci-logs-${{ matrix.os }}-${{ matrix.node }}"
          git add -f failure-tail.txt
          git commit -m "ci failure (${{ matrix.os }} node ${{ matrix.node }}) ${{ github.sha }}"
          git push -f origin "ci-logs-${{ matrix.os }}-${{ matrix.node }}"

  ocr-real-runtime:
    name: OCR real runtime install (optional)
    runs-on: ubuntu-latest
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run OCR real-install tests
        env:
          AGENT_CALLOUT_OCR_REAL_RUNTIME: "1"
          FAIL_LOG: ocr-output.log
        shell: bash
        run: set -o pipefail; npx vitest run tests/ocr-runtime.test.ts 2>&1 | tee ocr-output.log
      - name: Report failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = process.env.FAIL_LOG || 'verify-output.log';
            let tail = '';
            try { tail = fs.readFileSync(file, 'utf8').slice(-7000); } catch (e) { tail = String(e); }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] ${{ matrix.os }} node ${{ matrix.node }} failed at ${{ github.sha }}`.slice(0, 90),
              body: '```
' + tail + '
```'
            });

      - name: Push failure log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          tail -c 30000 ocr-output.log > failure-tail.txt || true
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git checkout -B ci-logs-ocr-real-runtime
          git add -f failure-tail.txt
          git commit -m "ci failure (ocr real runtime) ${{ github.sha }}"
          git push -f origin ci-logs-ocr-real-runtime
